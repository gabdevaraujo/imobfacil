spring:
  application:
    name: imobfacil
  datasource:
    url: jdbc:h2:mem:imobfacildb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        "[format_sql]": true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    context-path: /api

app:
  upload:
    dir: ${UPLOAD_DIR:uploads/imagens}
  mail:
    from: ${MAIL_FROM:noreply@imobfacil.com.br}
    admin: ${MAIL_ADMIN:contato@imobfacil.com.br}

jwt:
  secret: ${JWT_SECRET:6D5A7134743777217A25432A462D4A614E645267556B586E327235753878214125442A472D4B6150645367566B59703373367639792442264529482B4D62516548}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: false
    mail.smtp.starttls.enable: false

logging:
  level:
    root: INFO
    "[br.com.gva.imobfacil]": DEBUG

